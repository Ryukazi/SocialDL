<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign in — SocialDL</title>

    <link
        rel="stylesheet"
        href="./css/login.css"
    >

</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <a
                href="./index.html"
                class="back"
            >
                ← Back
            </a>


            <div class="login-logo">
                <span>S</span>
            </div>


            <h1>
                Welcome to SocialDL
            </h1>

            <p>
                Sign in to save your download history
                across your devices.
            </p>


            <button
                id="googleLogin"
                class="google-button"
            >

                <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                >

                    <path
                        fill="#4285F4"
                        d="M21.35 12.2c0-.7-.06-1.37-.18-2H12v3.79h5.23a4.47 4.47 0 0 1-1.94 2.94v2.45h3.14c1.84-1.7 2.92-4.2 2.92-7.18z"
                    />

                    <path
                        fill="#34A853"
                        d="M12 21.6c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.7-1.72-5.47-4.04H3.29v2.53A9.74 9.74 0 0 0 12 21.6z"
                    />

                    <path
                        fill="#FBBC05"
                        d="M6.53 13.67A5.86 5.86 0 0 1 6.23 12c0-.58.1-1.14.3-1.67V7.8H3.29A9.74 9.74 0 0 0 2.25 12c0 1.57.38 3.05 1.04 4.2l3.24-2.53z"
                    />

                    <path
                        fill="#EA4335"
                        d="M12 6.29c1.43 0 2.72.49 3.74 1.46l2.8-2.8C16.83 3.4 14.63 2.4 12 2.4a9.74 9.74 0 0 0-8.71 5.4l3.24 2.53C7.3 8.01 9.46 6.29 12 6.29z"
                    />

                </svg>

                Continue with Google

            </button>


            <div
                id="loginError"
                class="login-error hidden"
            ></div>


            <div class="login-footer">

                By continuing, you agree to use
                SocialDL responsibly.

            </div>

        </div>

    </main>


    <script
        type="module"
        src="./js/login.js"
    ></script>

</body>

</html>
